name: Deploy AWS Infrastructure (CDK v2 via OIDC)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-cdk:
    name: Assume OIDC Role & Deploy CDK Stack (mx-central-1 Querétaro)
    runs-on: ubuntu-latest
    env:
      AWS_REGION: mx-central-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Configure AWS Credentials via OIDC (Zero Static Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify OIDC Session & Target Region (mx-central-1)
        run: |
          aws sts get-caller-identity
          echo "Target AWS Region: $AWS_REGION"

      - name: Install dependencies & build packages
        run: |
          pnpm install --frozen-lockfile=false
          pnpm build

      - name: Bootstrap & Deploy AWS CDK Stack in Querétaro (mx-central-1)
        working-directory: ./infra
        env:
          CREATE_OIDC_RESOURCES: "false"
          CDK_DEFAULT_REGION: mx-central-1
        run: |
          npx cdk bootstrap --region mx-central-1
          npx cdk deploy WppesMachPocDevStack --region mx-central-1 --require-approval never --outputs-file cdk-outputs.json
          cat cdk-outputs.json
